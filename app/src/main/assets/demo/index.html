<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RojInk sample reader</title>
<style>
:root{color-scheme:light dark;font:16px system-ui,sans-serif;background:#f5f2e9;color:#23362d}*{box-sizing:border-box}
body{margin:0}main{max-width:44rem;margin:auto;padding:1rem}header{background:#143e33;color:#eef8da;border-radius:19px;padding:1.25rem}
h1{font:700 1.85rem/1.1 Georgia,serif;margin:.35rem 0 .7rem}p{line-height:1.55}h2{margin-top:1.4rem}img{width:100%;height:auto;display:block;border-radius:12px}
label{font-size:.78rem;letter-spacing:.09em;color:#ffd4c1}figure{margin:0}figcaption{padding-top:.45rem;font-size:.87rem}#later{margin-top:2rem}
@media(prefers-color-scheme:dark){:root{background:#152019;color:#e1ece0}}
</style></head>
<body><main>
<header><label translate="no">ROJINK · SAMPLE 01</label><h1>Beyond the hill</h1><p>Two friends follow a trail through the mountains. When the sun sets, they find a light in the distance.</p></header>
<h2>A comic panel</h2>
<figure><img src="chapter.png" alt="Comic panel with two speech bubbles" width="960" height="820" decoding="async"><figcaption>Press and hold a translated panel to see the original.</figcaption></figure>
<section id="later"><h2>A cafe menu</h2><p>Scroll to translate more. The prices should stay in their original positions.</p>
<img data-src="menu.png" alt="Cafe menu with item names and prices" width="960" height="560" loading="lazy" decoding="async"></section>
</main><script>
const observer = new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) { e.target.src=e.target.dataset.src; observer.unobserve(e.target); } }), {rootMargin:'300px'});
document.querySelectorAll('img[data-src]').forEach(e => observer.observe(e));
</script></body></html>
