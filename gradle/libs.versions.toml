[versions]
agp = "9.5.0"
kotlin = "2.2.10"
ksp = "2.3.4"
compose-bom = "2025.10.01"
activity = "1.11.0"
core = "1.17.0"
webkit = "1.15.0"
room = "2.8.4"
datastore = "1.2.0"
coroutines = "1.10.2"
mlkit = "16.0.1"
okhttp = "4.12.0"
jsoup = "1.21.2"
junit = "4.13.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-core" }
androidx-activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-room = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-tasks = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
mlkit-latin = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit" }
mlkit-chinese = { module = "com.google.mlkit:text-recognition-chinese", version.ref = "mlkit" }
mlkit-japanese = { module = "com.google.mlkit:text-recognition-japanese", version.ref = "mlkit" }
mlkit-korean = { module = "com.google.mlkit:text-recognition-korean", version.ref = "mlkit" }
mlkit-devanagari = { module = "com.google.mlkit:text-recognition-devanagari", version.ref = "mlkit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
