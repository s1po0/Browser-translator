name: Build Android APK

on:
  push:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Also build the signed release APK (requires repository secrets)
        type: boolean
        default: false

permissions:
  contents: read

# An explicit push request lets the owner sign builds on the working branch even
# before the workflow is on the default branch. Regular pushes stay debug only.
env:
  SIGN_APK: ${{ (github.event_name == 'workflow_dispatch' && inputs.signed_release) || (github.event_name == 'push' && github.repository == 's1po0/Browser-translator' && github.ref == 'refs/heads/arena/1fef4dd4-browser-translator' && contains(github.event.head_commit.message, '[signed-apk]')) }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          cmdline-tools-version: '15859902'
      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Test document scanner and original restore
        run: |
          npm ci --prefix tools/browser-tests --ignore-scripts --no-audit --no-fund
          npm test --prefix tools/browser-tests
      - name: Test and assemble debug APK
        run: tools/ci-gradle.sh :app:testDebugUnitTest :app:assembleDebug
      - name: Stage debug APK
        run: install -D -m 0644 app/build/outputs/apk/debug/app-debug.apk build/apk/translating-browser-debug.apk
      - uses: actions/upload-artifact@v7.0.2
        id: debug_apk
        with:
          path: build/apk/translating-browser-debug.apk
          archive: false
          if-no-files-found: error
      - name: Assemble and verify signed release
        if: env.SIGN_APK == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 repository secret}"
          : "${ANDROID_STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD repository secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS repository secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD repository secret}"
          umask 077
          export ANDROID_KEYSTORE_FILE
          ANDROID_KEYSTORE_FILE="$(mktemp --suffix=.keystore "$RUNNER_TEMP/rojink.XXXXXX")"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"; then
            echo '::error::ANDROID_KEYSTORE_BASE64 must contain only the complete Base64 keystore value.'
            exit 1
          fi
          unset ANDROID_KEYSTORE_BASE64
          releaseVersion=$((GITHUB_RUN_NUMBER + 1))
          tools/ci-gradle.sh -ProjinkVersionCode="$releaseVersion" :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          install -D -m 0644 app/build/outputs/apk/release/app-release.apk build/apk/rojink-signed-release.apk
      - uses: actions/upload-artifact@v7.0.2
        id: signed_apk
        if: env.SIGN_APK == 'true'
        with:
          path: build/apk/rojink-signed-release.apk
          archive: false
          if-no-files-found: error
      - name: APK download links
        if: ${{ !cancelled() && steps.debug_apk.outputs.artifact-url != '' }}
        env:
          DEBUG_URL: ${{ steps.debug_apk.outputs.artifact-url }}
          SIGNED_URL: ${{ steps.signed_apk.outputs.artifact-url }}
        run: |
          {
            printf '### Install on Android 8.0 or later\n\n'
            if [[ -n "$SIGNED_URL" ]]; then
              printf -- '- [Download signed RojInk APK](%s)\n' "$SIGNED_URL"
            fi
            printf -- '- [Download debug APK](%s)\n' "$DEBUG_URL"
            printf '\nSign in to GitHub, download the APK and open it directly on Android.\n'
          } >> "$GITHUB_STEP_SUMMARY"
