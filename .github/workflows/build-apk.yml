name: Build Panel Reader APK

on:
  push:
    branches:
      - arena/e4fd7646-browser-translator
    paths-ignore:
      - downloads/**
      - diagnostics/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Sync the web app into Android
        run: npm run android:sync

      - name: Build debug APK
        id: gradle
        continue-on-error: true
        run: |
          set +e
          cd android
          ./gradlew --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee ../gradle-build.log
          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Upload APK
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: panel-reader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Keep a copy on the active session branch so it can be downloaded directly
      # in environments where GitHub Actions artifact storage is inaccessible.
      - name: Publish APK to branch
        if: steps.gradle.outcome == 'success'
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/panel-reader.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/panel-reader.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated Panel Reader APK [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Save build failure diagnostics
        if: steps.gradle.outcome == 'failure'
        run: |
          mkdir -p diagnostics
          cp gradle-build.log diagnostics/gradle-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/gradle-build.log
          git commit -m "Save Android build diagnostics [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Mark failed build
        if: steps.gradle.outcome == 'failure'
        run: exit 1
