name: Probe translate image endpoints

on:
  push:
    paths:
      - '.github/workflows/diag-lens.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Probe
        run: |
          set -uo pipefail
          rm -rf lensprobe && mkdir -p lensprobe
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36'
          curl -fsSL -A "$UA" -e 'https://asurascans.com/' -o /tmp/page.webp \
            'https://cdn.asurascans.com/asura-images/chapters/murim-login/251/43921f.webp?v=1794161901' || echo "download failed" >> lensprobe/status.txt
          ls -l /tmp/page.webp >> lensprobe/status.txt 2>&1 || true
          for ep in \
            'https://translate.google.com/translate_a/i?client=gtx&sl=auto&tl=fa&otf=1&pc=1&sc=1' \
            'https://translate.googleapis.com/translate_a/i?client=gtx&sl=auto&tl=fa&otf=1&pc=1&sc=1' \
            'https://translate.google.com/translate_a/t?client=gtx&sl=auto&tl=fa'; do
            name=$(echo "$ep" | md5sum | cut -c1-8)
            code=$(curl -sS -o "lensprobe/body-$name.txt" -w '%{http_code}' -A "$UA" -H 'Accept-Language: en-US,en;q=0.9' \
              -F "image=@/tmp/page.webp;type=image/webp" -F 'filename=page.webp' "$ep" 2>/dev/null || echo ERR)
            echo "$ep -> $code size=$(wc -c < lensprobe/body-$name.txt 2>/dev/null || echo 0)" >> lensprobe/status.txt
            head -c 4000 "lensprobe/body-$name.txt" > "lensprobe/sample-$name.txt" 2>/dev/null || true
            rm -f "lensprobe/body-$name.txt"
          done
      - name: Commit probe
        run: |
          git config user.name 'diag-bot'
          git config user.email 'diag@users.noreply.github.com'
          git add lensprobe
          git commit -m 'Translate image probe' || exit 0
          git push
