name: Fetch diagnostic pages

on:
  push:
    paths:
      - '.github/workflows/diag-fetch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download chapter pages
        run: |
          set -euo pipefail
          mkdir -p diag
          pages="f556dc f5b3b7 216ee8 f8b2a2 63ceda e6f6f0 1d80bd 7bcb4c 2a2645 18ee32 089808 83067a 615165 43921f 3cf68b ca7f3a dbb115 24c960"
          i=1
          for id in $pages; do
            n=$(printf '%02d' "$i")
            curl -fsSL --retry 3 -A 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36' \
              -e 'https://asurascans.com/' -o "diag/page$n.webp" \
              "https://cdn.asurascans.com/asura-images/chapters/murim-login/251/$id.webp?v=1794161901"
            ls -l "diag/page$n.webp"
            i=$((i + 1))
          done
      - name: Commit pages
        run: |
          git config user.name 'diag-bot'
          git config user.email 'diag@users.noreply.github.com'
          git add diag
          git commit -m 'Add Murim Login 251 diagnostic pages' || exit 0
          git push
