name: Reader device smoke tests

on:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'tools/ci-gradle.sh'
      - '**/*.gradle.kts'
      - '.github/workflows/device-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Prepare emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Browser and real OCR on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          heap-size: 512M
          script: tools/ci-gradle.sh :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-smoke-results
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
