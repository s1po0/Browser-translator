name: Reader device smoke tests

on:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'tools/ci-gradle.sh'
      - 'tools/ci-reader-smoke.sh'
      - '**/*.gradle.kts'
      - '.github/workflows/device-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-4k
            target: google_apis
            page_size: 4096
            test_args: ""
          - name: english-16k
            target: google_apis_ps16k
            page_size: 16384
            test_args: -Pandroid.testInstrumentationRunnerArguments.class=dev.rojink.browser.translation.EnglishComicSmokeTest,dev.rojink.browser.translation.TallComicSmokeTest
    name: Reader (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Prepare emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Browser and real OCR on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          # Compilation can outlast the emulator's display timeout; clipboard/gesture tests need an unlocked screen.
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 2147483647
            # Background launcher dialogs can steal clipboard-test focus on the CI emulator.
            # The test still requires a responsive app and its focused window.
            adb shell settings put global hide_error_dialogs 1
            adb shell wm dismiss-keyguard
            test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = '${{ matrix.page_size }}'
            tools/ci-reader-smoke.sh ${{ matrix.test_args }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-smoke-results-${{ matrix.name }}
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
