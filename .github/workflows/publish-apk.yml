name: Publish signed Sipan APK

on:
  push:
    branches: [arena/1fef4dd4-browser-translator]

permissions: {}

jobs:
  publish:
    if: github.repository == 's1po0/Browser-translator' && contains(github.event.head_commit.message, '[publish-apk:')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency: sipan-public-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Select a signed APK from a tested build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # A separate line in the commit message names a completed Build Android APK run.
          run_id=$(sed -nE 's/^\[publish-apk:([1-9][0-9]{0,18})\]$/\1/p' <<< "$COMMIT_MESSAGE")
          [[ "$run_id" =~ ^[1-9][0-9]{0,18}$ ]]
          api="repos/$GITHUB_REPOSITORY/actions"
          sha=$(gh api "$api/runs/$run_id" | jq -er --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" '
            select(.path == ".github/workflows/build-apk.yml" and .conclusion == "success"
              and .head_repository.full_name == $repo and .head_branch == $branch) | .head_sha
          ')
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          tests=$(gh api "$api/workflows/device-smoke.yml/runs?head_sha=$sha&status=success&per_page=1" | jq -er '
            .workflow_runs[0] | select(.conclusion == "success") | .html_url
          ')
          artifact=$(gh api "$api/runs/$run_id/artifacts?name=sipan-signed-release.apk" | jq -cer '
            [.artifacts[] | select(.name == "sipan-signed-release.apk" and .expired == false)]
            | select(length == 1) | .[0]
          ')
          id=$(jq -er '.id' <<< "$artifact")
          digest=$(jq -er '.digest | sub("^sha256:"; "")' <<< "$artifact")
          [[ "$id" =~ ^[1-9][0-9]*$ && "$digest" =~ ^[a-f0-9]{64}$ ]]
          {
            printf 'run=%s\n' "$run_id"
            printf 'commit=%s\n' "$sha"
            printf 'tests=%s\n' "$tests"
            printf 'artifact=%s\n' "$id"
            printf 'sha256=%s\n' "$digest"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.source.outputs.artifact }}
          path: ${{ runner.temp }}/sipan-release
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'build-tools;36.0.0'
          cmdline-tools-version: '15859902'
      - name: Publish to Releases and verify the anonymous download
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_RUN: ${{ steps.source.outputs.run }}
          TESTS_URL: ${{ steps.source.outputs.tests }}
          APK_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          set -euo pipefail
          stage='Verify the new APK checksum'
          trap 'printf "::error title=Publish APK failed::%s (line %d)\n" "$stage" "$LINENO" >&2' ERR
          apk="$RUNNER_TEMP/sipan-release/sipan-signed-release.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          printf '%s  %s\n' "$APK_SHA256" "$apk" | sha256sum -c -
          signer_digests() {
            # Build Tools can use either "Signer #1" or a scheme label such as "V3.0 Signer:".
            "$tools/apksigner" verify --print-certs "$1" |
              sed -nE 's/^(V[0-9]+(\.[0-9]+)? )?Signer( #[0-9]+)?:? certificate SHA-256 digest: ([[:xdigit:]]{64})[[:space:]]*$/\4/p' |
              tr 'A-F' 'a-f' | sort -u
          }
          stage='Verify the Android signing certificate'
          signers=$(signer_digests "$apk")
          [[ -n "$signers" ]]
          stage='Read package and version from the new APK'
          badging=$("$tools/aapt" dump badging "$apk" | sed -n '1p')
          [[ "$badging" == "package: name='dev.rojink.browser' "* ]]
          version=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$badging")
          code=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$badging")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$code" =~ ^[1-9][0-9]*$ ]]
          tag="v$version"
          stage='Identify the previous public release'
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$previous" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$previous" != "$tag" ]]; then
            stage='Download the previous public APK'
            old="$RUNNER_TEMP/sipan-previous.apk"
            curl -q --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 150 --output "$old" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$previous/sipan-signed-release.apk"
            stage='Check the previous APK has the same package and signer and an older version code'
            old_signers=$(signer_digests "$old")
            old_badging=$("$tools/aapt" dump badging "$old" | sed -n '1p')
            old_code=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$old_badging")
            [[ "$old_badging" == "package: name='dev.rojink.browser' "* && "$old_signers" == "$signers" ]]
            [[ "$old_code" =~ ^[1-9][0-9]*$ ]]
            (( code > old_code ))
            upgrade="Same package and signing certificate as $previous; versionCode $old_code → $code."
            printf '::notice title=Install-over check::%s\n' "$upgrade"
            printf '%s\n' "$upgrade" >> "$GITHUB_STEP_SUMMARY"
          fi
          stage='Verify an existing version tag points at the tested commit'
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null || true)
          tag_options=(--target "$SOURCE_COMMIT")
          if [[ -n "$tag_ref" ]]; then
            jq -e --arg sha "$SOURCE_COMMIT" '.object.type == "commit" and .object.sha == $sha' <<< "$tag_ref" >/dev/null
            tag_options=(--verify-tag)
          fi
          stage='Create the GitHub release'
          notes="$RUNNER_TEMP/sipan-release-notes.md"
          {
            printf 'Download **sipan-signed-release.apk** on Android 8.0 or later and open it in Files. Install over the previous signed Sipan/RojInk app without uninstalling it.\n\n'
            printf '**APK SHA-256:** `%s`\n\n' "$APK_SHA256"
            printf '[Signed build](%s/%s/actions/runs/%s) · [Android tests](%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$SOURCE_RUN" "$TESTS_URL"
          } > "$notes"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! release_output=$(gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" "${tag_options[@]}" \
                --title "Sipan $version" --notes-file "$notes" 2>&1); then
              diagnostic=${release_output:0:1200}
              diagnostic=${diagnostic//%/%25}; diagnostic=${diagnostic//$'\r'/%0D}; diagnostic=${diagnostic//$'\n'/%0A}
              printf '::error title=GitHub release creation failed::%s\n' "$diagnostic" >&2
              exit 1
            fi
            printf '%s\n' "$release_output"
          fi
          stage='Verify the anonymous release download and checksum'
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/sipan-signed-release.apk"
          published="$RUNNER_TEMP/sipan-public.apk"
          curl -q --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 150 --output "$published" "$url"
          printf '%s  %s\n' "$APK_SHA256" "$published" | sha256sum -c -
          printf '[Download signed Sipan %s APK (no sign-in)](%s)\n' "$version" "$url" >> "$GITHUB_STEP_SUMMARY"
